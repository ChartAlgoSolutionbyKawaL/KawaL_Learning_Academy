<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel Mastery — ResolvrPro Learning Academy</title>
<link rel="stylesheet" href="css/styles.css?v=20260830">
<link rel="stylesheet" href="css/bonus.css?v=20260830">
<link rel="stylesheet" href="css/templates.css?v=20260830">
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loader">
  <div class="ldr-logo">RESOLVR<span>PRO</span></div>
  <div class="ldr-bar"><i></i></div>
  <div class="ldr-txt">Loading Learning Path…</div>
</div>

<!-- HEADER — premium corporate LMS header (ResolvrPro Learning Academy) -->
<header>
  <button class="icon-btn hamburger" id="btnNav" data-tip="Menu" aria-label="Toggle navigation">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <!-- ResolvrPro umbrella brand -->
  <div class="brand" id="brandHome" title="Go to dashboard">
    <div class="brand-mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6h6a4 4 0 010 8H7zM7 14h7a4 4 0 010 8H7z"/><path d="M7 6v16"/></svg>
    </div>
    <div class="brand-txt">
      <div class="n">RESOLVRPRO</div>
      <div class="s">Get Unstuck. Get Ahead.</div>
    </div>
  </div>

  <div class="brand-sep"></div>

  <div class="search-wrap">
    <svg class="si" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="text" placeholder="Search steps, topics, functions, features..." autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
    <div id="results"></div>
  </div>

  <div class="hdr-right">
    <div class="hdr-prog" data-tip="Course progress">
      <span class="lbl"><b id="progName">Excel Mastery</b> Progress <b id="progPct">0%</b></span>
      <div class="track"><i id="progBar" style="width:0%"></i></div>
    </div>

    <div class="hdr-sep"></div>

    <button class="hdr-link" id="btnDashboard">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span class="hdr-label">Inspiration Wall</span>
    </button>

    <button class="hdr-link" id="btnBookmarks">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
      <span class="hdr-label">Bookmarks</span>
      <span class="hdr-count" id="bmCount">0</span>
    </button>
    <a class="hdr-link" id="btnDownload" data-tip="Download current lesson">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 21h16"/></svg>
      <span class="hdr-label">Download</span>
    </a>

    <div class="pz" data-tip="Page zoom">
      <button class="pz-btn" id="pzOut" aria-label="Decrease page zoom">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12h14"/></svg>
      </button>
      <button class="pz-val" id="pzVal" aria-label="Reset page zoom to 80%">80%</button>
      <button class="pz-btn" id="pzIn" aria-label="Increase page zoom">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div class="hdr-sep"></div>

    <button class="user" id="btnUser">
      <span class="avatar">K</span>
      <span class="un">Kawal</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--txt3)"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <div class="menu" id="userMenu">
      <div class="mh">
        <div class="a">Kawal</div>
        <div class="b">Excel Mastery Learner</div>
      </div>
      <button id="miDashboard">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        My Dashboard
      </button>
      <button id="miBookmarks">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        My Bookmarks
      </button>
      <button id="miZoomReset">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M8 11h6"/></svg>
        Reset Page Zoom (80%)
      </button>
      <button class="danger" id="miReset">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9"/><path d="M3 4v5h5"/></svg>
        Reset My Progress
      </button>
    </div>
  </div>
</header>

<div class="shell">
  <div class="scrim" id="scrim"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot" id="navFoot"></div>
  </aside>

  <!-- MAIN -->
  <main>
    <div class="bar">
      <button class="icon-btn bar-navtoggle" id="btnNavToggle" data-tip="Collapse / expand navigation" aria-label="Collapse navigation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <div class="crumb" id="crumb"></div>
      <div class="bar-right" id="barRight"></div>
    </div>
    <div class="content" id="content">
      <div class="product-tabs" id="productTabs" role="tablist" aria-label="Learning Academy products"></div>
      <div class="wrap" id="wrap"></div>
    </div>
  </main>

  <!-- RIGHT-SIDE PRACTICE DRAWER (toggled from the toolbar) -->
  <div class="drawer-scrim" id="drawerScrim"></div>
  <aside class="drawer" id="practiceDrawer" aria-hidden="true">
    <div class="drawer-hd">
      <span class="drawer-title">Practice Exercise</span>
      <button class="icon-btn" id="drawerClose" data-tip="Close" aria-label="Close practice drawer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="practiceDrawerBody"></div>
  </aside>
</div>

<script src="js/data/registry.js?v=20260830"></script>
<script src="js/data/dashboards.js?v=20260830"></script>
<script src="js/data/templates.js?v=20260830"></script>
<script src="js/registry-api.js?v=20260830"></script>
<script src="js/pages/dashboard.js?v=20260830"></script>
<script src="js/pages/step.js?v=20260830"></script>
<script src="js/pages/practice-hub.js?v=20260830"></script>
<script src="js/pages/topic.js?v=20260830"></script>
<script src="js/pages/reference.js?v=20260830"></script>
<script src="js/pages/bonus.js?v=20260830"></script>
<script src="js/pages/templates.js?v=20260830"></script>
<script src="js/navigation.js?v=20260830"></script>
<script src="js/app.js?v=20260830"></script>
<!-- paper-cut (deckle) edge filter for the Inspiration Wall panels; referenced via url(#paperCut) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="paperCut" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
</body>
</html>
